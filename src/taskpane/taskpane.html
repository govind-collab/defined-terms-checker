<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Defined Terms Checker</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <link rel="stylesheet" href="taskpane.css" />
  </head>
  <body>
    <main id="app">
      <header>
        <h1>Defined Terms</h1>
        <p class="hint">
          Checks the defined terms in this document. Nothing in the document is changed and nothing leaves
          Word.
        </p>
      </header>

      <section class="controls">
        <button id="check" type="button" class="primary" disabled>Check document</button>
        <label><input id="opt-single" type="checkbox" checked /> Read 'single quotes' as term quotes</label>
        <label><input id="opt-lower" type="checkbox" checked /> Report lowercase uses</label>
      </section>

      <p id="status" role="status" aria-live="polite"></p>
      <p id="summary" class="summary" hidden></p>
      <section id="findings" aria-label="Findings"></section>
      <section id="ignored" aria-label="Ignored terms" hidden></section>

      <footer><small id="version"></small></footer>
    </main>
  </body>
</html>
